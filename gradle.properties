# Gradle 8.9 + AGP 8.6.1：2G 堆足够 M0；构建时由 TeaTalk/build.sh 注入 GRADLE_USER_HOME
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.net.useSystemProxies=false
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 沙箱下 Kotlin 编译守护进程写 %TEMP% 会被拒，改为进程内编译（M0 规模无感）
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
